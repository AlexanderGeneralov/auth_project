[project]
name = "auth-project"
version = "0.1.0"
description = ""
authors = [
    {name = "generalov",email = "alaxander.generalov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "greenlet (>=3.5.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "auth_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]  
app = "src.auth_project.main:start"